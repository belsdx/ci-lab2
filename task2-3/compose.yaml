services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_task23
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  producer:
    build: ./producer
    environment:
      RABBITMQ_HOST: rabbitmq
    volumes:
      # Связанная точка монтирования (bind mount) для producer
      - ./data-producer:/var/data
    depends_on:
      rabbitmq:
        condition: service_healthy

  consumer:
    build: ./consumer
    environment:
      RABBITMQ_HOST: rabbitmq
    volumes:
      # Связанная точка монтирования (bind mount) для consumer
      - ./data-consumer:/var/data
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  rabbitmq_data:
